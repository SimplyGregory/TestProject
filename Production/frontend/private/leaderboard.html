<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.25">
    <title>Leaderboard | Pylingo</title>
    <link rel="icon" type="image/x-icon" href="../content/media/favicon.ico">
    <link rel="stylesheet" href="../content/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --sidebar_width: max(13vw, 150px);
        }

        body {
            font-family: "Inter", system-ui, sans-serif;
        }

        #side_bar {
            position: fixed;
            top: 0px;
            left: 0px;
            height: 100%;
            width: var(--sidebar_width);
            background-color: var(--foreground);
            container-type: inline-size;
        }
        .side_logo img {
            width: 85%;
            height: auto;
            padding-left: 9%;
            padding-right: 9%;
            margin-top: 10%;
        }
        
        button {
            font: inherit;
        }

        .option_icon img {
            width: 15.4cqw;
            min-width: 20px;
        }

        .option_icon {
            flex: 0 0 25%;
            display: flex;
        }

        #side_bar_options {
            list-style-type: none;
            position: relative;
            padding: 0 10%;
        }

        #side_bar_options li {
            display: flex;
            margin-bottom: 10px;
        }

        #side_bar_options li button {
            border-radius: 12px;
            background: transparent;
            border: transparent;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 5% 3%;
        }

        #side_bar_options li button:hover {
            background-color: var(--foreground2);
        }

        .option_name {
            font-size: 7.7cqw;
            font-weight: 300;
            color: var(--text);
        }

        #main_body {
            margin-left: var(--sidebar_width);
            min-height: 100vh;
            box-sizing: border-box;
            padding: 1vh 2%;
        }

        #Welcome {
            display: flex;
            flex-direction: column;
        }

        #greeting {
            font-size: clamp(28px, 4.5cqw, 50px);
        }

        .profile {
            position: absolute;
            top: 2cqw;
            right: 2cqw;
            aspect-ratio: 1 / 1;
            width: clamp(20px, 5cqw, 80px);
        }

        .profile picture img {
            border-radius: 12px;
        }

        #streak {
            right: 7cqw;
            top: 1.8cqw;
            position: absolute;
            width: clamp(60px, 15cqw, 240px);
            height: clamp(20px, 5cqw, 80px);
            justify-content: center;
            align-items: center;
            display: flex;
        }

        .streak_icon {
            aspect-ratio: 1 / 1;
            width: clamp(25px, 3.5cqw, 65px);
            height: 1em;
            width: auto;
            
        }

        .streak_count {
            font-weight: bold;
            font-size: 1.8em;
            line-height: 1;
        }
        
        #streak_text {
            display: flex;
            flex-direction: column;
            position: relative;
            left: 2%;
            line-height: 0.91;
            font-size: clamp(5px, 2cqw, 22px);
        }

        #leaderboard {
            position: absolute;
            top: 20%;
            background-color: var(--foreground);
            width: 82%;
            height: 76%;
            border-radius: 12px;
            overflow: hidden;
        }

        .leaderboard_top {
            margin-top: 2%;
            display: flex;
            gap: 10px;
            margin: 2% 5% 0;
            padding: 0 12px;
        }

        #username_title {
            flex: 1;
        }

        #placement_title, .placement {
            width: 85px;
        }

        #leaderboard_title {
            position: relative;
            color: var(--text);
            font-size: clamp(14px, 1.4vw, 20px);
            margin-left: 1%;
            top: 3%;

        }

        #goto_leaderboard {
            position: relative;
            top: 2%;
            margin-right: 3%;
            white-space: nowrap;
            font-size: clamp(12px, 1.1vw, 16px);
            text-decoration: underline;
            cursor: pointer;
        }

        .leaderboard_item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(13px, 1.3vw, 20px);
            color: var(--text);
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 12px;
            overflow-x: hidden;

        }

        #leaderboard_list {
            position: relative;
            width: 90%;
            left: 5%;
            top: 5%;
            list-style: none;
            margin: 0;
            padding: 0;
            color: var(--text);
            font-size: 20px;
            font-weight: 500;
        }

        .user {
            flex: 1;
        }

        .placement {
            font-weight: 700;
        }

        .streak_icon_top {
            height: clamp(20px, 3.5vw, 60px);
            width: auto;
        }

        .streak_class {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 1em;
            width: auto;
        }

        .streak_num {
            font-weight: 600;
        }

        #sort {
            position: absolute;
            margin-top: 2%;
            margin-left: 1%;
            height: 4%;
            width: 80%;
            white-space: nowrap;
        }

        #sort button {
            color: var(--text);
            position: relative;
            background-color: #6f9cc0;
            border: none;
            border-radius: 12px;
            width: 10%;
            height: 100%;
            margin-right: 1%;
            font-size: clamp(5px, 1vw, 15px);
        }

        #sort .active {
            background: #425b70;
            cursor: default;
        }

        #sort button:hover:not(.active) {
            background-color: #88bbe4;
            cursor: pointer;
        }

    </style>
</head>
<body style="margin: 0;">
    <div id="side_bar">
        <picture class="side_logo">
            <source srcset="../content/media/logo_White.png" media="(prefers-color-scheme: dark)">
            <img src="../content/media/logo_Black.png">
        </picture>
        <ul id="side_bar_options">
            <li><button><picture class="option_icon">
            <source srcset="../content/media/home_White.png" media="(prefers-color-scheme: dark)">
            <img src="../content/media/home_Black.png">
        </picture><span class="option_name">Home</span></button>
            </li>
            <li>
                <button>
                    <picture class="option_icon">
                        <source srcset="../content/media/leaderboard_White.png" media="(prefers-color-scheme: dark)">
                        <img src="../content/media/leaderboard_Black.png">
                    </picture><span class="option_name">Leaderboard</span>
                </button>
                </li>
            <li><button><picture class="option_icon">
                <source srcset="../content/media/settings_White.png" media="(prefers-color-scheme: dark)">
                <img src="../content/media/settings_Black.png">
            </picture><span  class="option_name">Settings</span></button></li>
        </ul>
    </div>

    <div id="main_body">
        <div id="Welcome">
            <span id="greeting">Leaderboard</span>
        </div>
        <div id="streak">
            <img class="streak_icon_top" src="../content/media/fire.png">
            <div id="streak_text">
                <span class="streak_count">12</span>
                <span>day streak</span>
            </div>
        </div>
        <div class="profile">
            <picture class="option_icon">
                <source srcset="../content/media/empty-profile_White.png" media="(prefers-color-scheme: dark)">
                <img src="../content/media/empty-profile_Black.png">
            </picture>
        </div>
        <div id="sort">
            <button class="active">All Time</button>
            <button>This Month</button>
            <button>This Week</button>
        </div>
        <div id="leaderboard">
                <div class="leaderboard_top">
                    <span id="placement_title">placement</span>
                    <span id="username_title">username</span>
                    <span id="streak_title">streak</span>
                </div>
                <ol id="leaderboard_list">
                    <li class="leaderboard_item first">
                        <span class="placement">1</span>
                        <span class="user">USERNAME</span>
                        <span class="streak_class">
                            <img class="streak_icon" src="../content/media/fire.png">
                            <span class="streak_num">0</span>
                        </span>
                    </li>
                    <li class="leaderboard_item second">
                        <span class="placement">2</span>
                        <span class="user">USERNAME</span>
                        <span class="streak_class">
                            <img class="streak_icon" src="../content/media/fire.png">
                            <span class="streak_num">0</span>
                        </span>
                    </li>
                    <li class="leaderboard_item third">
                        <span class="placement">3</span>
                        <span class="user">USERNAME</span>
                        <span class="streak_class">
                            <img class="streak_icon" src="../content/media/fire.png">
                            <span class="streak_num">0</span>
                        </span>
                    </li>
                </ol>
            </div>
    </div>
</body>
    <script>
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    </script>
</html>
