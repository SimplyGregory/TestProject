<head>

</head>
<body>

            <div class="sidebar_nav">

                    <a class="nav-link" href="">

                </a>
            </div>
            <div class="">
                <a class="nav-link" href="">
                    <span class="nav-link">

                            <img src="/media/crown.png">

                </a>
            </div>
            <div class="">
                <a class="nav-link"  href="">
                    <span class="nav-link">
                        <div class="nav-link_icon">
                            <img src="/media/holy-grail.png">

                </a>
            </div>
            <div class="">
                <a class="nav-link" href="">
                    <span class="nav-link">
                        <div class="nav-link_icon">
                            <img src="/media/shopping-cart.png">

                        <div class="nav-link_tooltip hidden" style="transform: translateY(0px); z-index: 310;">Shop</div>
                    </span>
                </a>
            </div>
            <div class="">
                <div class="nav-link" href="">
                    <span class="nav-link--menu-trigger nav-link--menu-trigger nav-link" role="button" tabindex="0">
                        <span class="nav-link--menu-trigger nav-link">
                            <div class="nav-link_icon">
                                <img src="https://d35aaqx5ub95lt.cloudfront.net/vendor/7159c0b5d4250a5aea4f396d53f17f0c.svg">

                            <span class="nav-link_label">More</span>

                                    <div class="more-menu_list">
                                        <button class="more-menu_item">
                                            <span>Settings</span>
                                        </button>
                                        <form method="POST" action="/send-logout">

                                                <span>Log Out</span>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                    </span>
                </div>

    body {
        background-color: rgb(19, 31, 36);
        overflow: hidden;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;  
        font-family: 'Arial Black', sans-serif;
    }

    .option-buttons {
        position: absolute;
        top: 3%;
        right: 3%;
        z-index: 12;
        flex-direction: row;
        display: inline-flex;
        justify-content: flex-end;
        text-align: right;
        direction: rtl;
        
    }

        background-color: #373737;
        height: 30px;
        color: #929292;
        position: relative;
        top: -4px;
    }

    .option-buttons button {
        background-color: transparent;
        border: 0px solid transparent;
        height: 20px;
        color: #1d1d1d;
        cursor: pointer;
        font-family: inherit;
    }

    .option-buttons button:hover span:first-child {
        text-decoration: underline;
    }

    .option-buttons button:not(:has(span)):hover {
        text-decoration: underline;
    }

    .sidebar_logo-compact {
        display: initial;
        height: 40px;
        width: 40px;
    }
    
    .sidebar_logo-link {
        display: block;
        height: 100%;
        width: -moz-fit-content;

        padding: 36px 0 25px 10px;
    }

        display: flex;
        flex-direction: column;
    }

        color: rgb(73, 192, 248);
    }

    .nav-link_label {
        color: rgb(220, 230, 236);
        display: none;
        font-size: 15px;
        font-weight: 700;
        text-transform: uppercase;
        transition: none;
        letter-spacing: .8px;
    }

    .nav-link_icon img {
        height: 32px;
        padding-right: 0;
        transition: filter .2s;
        width: 32px;
    }

    .nav-link_icon {
        display: flex;
        position: relative;
    }

    .nav-link {
        border: 2px solid transparent;
        padding: 0;
        justify-content: center;
        position: relative;
        align-items: center;
        display: flex;
        flex-direction: row;
        width: 100%;
        height: 48px;
        border-radius: 12px;
        cursor: pointer;

        padding: 7px 12px;

    }

        transform: translateZ(0);

        padding: 8px 0;
    }

    .more-menu_item {
        background: none;
        border: none;
        transition: filter .2s;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        cursor: pointer;
        display: inline-flex;
        position: relative;
        touch-action: manipulation;
        transform: translateZ(0);
        -moz-osx-font-smoothing: grayscale;
        -webkit-font-smoothing: antialiased;
        --web-ui_button-filter-hover: none;
        align-items: center;
        box-sizing: border-box;

        padding: 0 40px 0 20px;
        text-transform: uppercase;
        white-space: nowrap;
        width: 100%;
        height: 40px;

    .more-menu.hidden {
        visibility: hidden;
    }

    .more-menu_item:hover {
        background-color: rgb(32, 47, 54);
    }
