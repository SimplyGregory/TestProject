<style>
    
    body {
        background-color: rgb(19, 31, 36);
        overflow: hidden;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;  
        font-family: 'Arial Black', sans-serif;
    }

    .option-buttons {
        position: absolute;
        top: 3%;

        z-index: 12;
        flex-direction: row;
        display: inline-flex;
        justify-content: flex-end;
        text-align: right;
        direction: rtl;
        
    }

    .option-buttons button.active {

        height: 30px;
        color: #929292;
        position: relative;
        top: -4px;
    }

    .option-buttons button {
        background-color: transparent;
        border: 0px solid transparent;
        height: 20px;
        color: #1d1d1d;
        cursor: pointer;
        font-family: inherit;
    }

    .option-buttons button:hover span:first-child {
        text-decoration: underline;
    }

    .option-buttons button:not(:has(span)):hover {
        text-decoration: underline;
    }

    .username-button {
        align-items: center;
        display: inline-flex;
        font-size: 14px;

    }
    .username-caret {

        top: 4px;
        left: 110%;

    .caret-container {

        top: 7.5%;
        right: 1.8%;
        width: 100px;
        height: 60px;
        background-color: #373737;
    }
    .caret-container button {
        width: 90%;
        margin-top: 4px;
        margin-left: 5%;
        height: 40%;
        background-color: #ffffff;
        border: 0px solid transparent;
        color: #1d1d1d;
        cursor: pointer;
        font-family: inherit;
    }

    .caret-container button:hover {
        background-color: #a0a0a0;
    }

    .caret-container.hidden {
        display: none;
    }

    #side_bar {
        background-color: rgb(19, 31, 36);
        box-sizing: border-box;
        color: rgb(82, 101, 109);
        height: 100vh;
        overflow-y: auto;
        padding: 0 16px;
        top: var(--web-ui_topbar-top, 0);
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
        width: calc(var(--web-ui_navbar-width-no-labels, 56px) + 32px);
    }

    .sidebar__logo-compact {
        display: initial;
        height: 40px;
        width: 40px;
    }

    .sidebar__logo-full {
        display: none;
        height: 30px;
        width: 128px;
    }
    
    .sidebar__logo-link {
        display: block;
        height: 100%;
        width: -moz-fit-content;
        width: fit-content;
    }

    .sidebar__logo {
        box-sizing: content-box;
        height: 39px;
        padding: 36px 0 25px 10px;
    }

    .sidebar {
        left: 0;
        position: fixed !important;
    }

    .sidebar {
        background-color: rgb(19, 31, 36);
        border-right: var(--web-ui_navbar-border-right, 2px solid rgb(55, 70, 79));
        box-sizing: border-box;
        color: rgb(82, 101, 109);
        height: 100vh;
        overflow-y: auto;
        padding: 0 16px;
        top: var(--web-ui_topbar-top, 0);
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
        width: calc(var(--web-ui_navbar-width-no-labels, 56px) + 32px);
    }

    .sidebar {

        -webkit-font-smoothing: antialiased;
        -ms-overflow-style: none;

    .sidebar__item .nav-link__label {
        color: rgb(73, 192, 248);
    }

    .nav-link__label {
        color: rgb(220, 230, 236);
        display: none;
        font-size: 15px;
        font-weight: 700;
        text-transform: uppercase;
        transition: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
    }

    .nav-link__label {
        letter-spacing: .8px;
    }

    .nav-link__icon img {
        height: 32px;
        padding-right: 0;
        transition: filter .2s;
        width: 32px;
    }

    .nav-link__icon {
        display: flex;
        position: relative;
    }

    .nav-link--active {
        background-color: rgb(32, 47, 54);
        border: 2px solid rgb(63, 133, 167);
        border-radius: 12px;
    }

    .nav-link {
        border: 2px solid transparent;
        padding: 0;
    }

    .nav-link {

    }

    .nav-link {
        justify-content: center;
        position: relative;
    }

    .nav-link {
        align-items: center;
        display: flex;
        flex-direction: row;
    }

    .nav-link {
        width: 100%;
    }

    .nav-link--active {
        background-color: rgb(32, 47, 54);
        border: 2px solid rgb(63, 133, 167);
        border-radius: 12px;
    }

    .nav-link__tooltip {
        background-color: rgb(220, 230, 236);
        border: none;
        border-radius: 8px;
        color: rgb(19, 31, 36);
        font-size: 15px;
        left: 88px;
        padding: 7px 12px;

    }

        position: fixed;
    }

</style>
<script>
    document.querySelector('.username-button').addEventListener('click', function() {
        const caret = document.querySelector('.username-caret');
        const caretContainer = document.querySelector('.caret-container');

        caret.style.transform = caret.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
        caretContainer.classList.toggle('hidden');
    });

    document.querySelectorAll('.option-buttons button:not(:has(span))').forEach(button => {
        button.addEventListener('click', function(event) {
            const buttons = document.querySelectorAll('.option-buttons button');
            buttons.forEach(button => button.classList.remove('active'));
            if (event.target.tagName === 'BUTTON') {
                event.target.classList.add('active');
            }
        });
    });
</script>
