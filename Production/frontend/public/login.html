<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.25">
    <title>Login | Pylingo</title>
    <link rel="icon" type="image/x-icon" href="../content/media/favicon.ico">
    <link rel="stylesheet" href="../content/style.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url("../content/media/background.jpg") center / cover no-repeat;
        }

        .auth_container {
            width: 90%;
            max-width: 27.5em;
            background-color: var(--foreground);
            border-radius: 0.875rem;
            z-index: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            max-height: 90vh;
            height: auto;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .auth_container::-webkit-scrollbar {
            width: 7px;
        }

        .auth_container::-webkit-scrollbar-track {
            background: transparent;
        }

        .auth_container::-webkit-scrollbar-thumb {
            background: var(--foreground2);
            border-radius: 12px;
            border-width: 5px;
            width: 7px;
            height: 10px;
        }

        .centering {
            max-width: 100%;
            padding: clamp(1rem, 2vw, 1.5rem) clamp(1rem, 4vw, 2.25rem) clamp(1.25rem, 4vw, 2rem);
            position: relative;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .auth_logo img {
            display: block;
            height: auto;
            margin: 0 auto 0.375rem;
            max-width: 100%;
            width: 185px;
        }

        .form_input {
            margin-top: 2rem !important;
            font-size: 17px;
            font-weight: lighter;
        }

        .form_input2 {
            margin-top: .5rem !important;
            margin-bottom: 1rem !important;
            font-size: 17p;
            font-weight: lighter;
        }

        .form {
            margin-top: 5px !important;
            display: block;
            width: 100%;
            box-sizing: border-box;
            min-height: calc(1.5em + 1rem + 2px);
            padding: 0.3rem 1rem;
            padding-right: 2.5rem;
            font-size: 0.825rem;
            font-weight: 400;
            background-color: var(--foreground);
            background-clip: padding-box;
            border: 1px solid var(--background);
            border-radius: 0.5rem;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            color: var(--text);
        }

        .form:focus {
            outline: none;
            border-color: var(--foreground2);
            box-shadow: 0 0 0 0.2rem rgba(121, 131, 179, 0.25);
        }

        .input_error {
            color: var(--error);
            position: relative;
            font-size: 10px;
            font-weight: 100;
            letter-spacing: 1px;
            visibility: hidden;
            margin-top: 3%
        }

        .forgot {
            margin-top: 1.5%;
            margin-left: auto;
            float: right;
        }

        .link {
            color: var(--link);
            position: relative;
            font-size: 10px;
            font-weight: 100;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: underline;
        }

        .toggle_password {
            position: relative;
            left: 91%;
            margin-bottom: -2rem;
            transform: translateY(-110%);
            display: flex;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.25rem;
            align-items: center;
            justify-content: center;
        }

        .login_submit {
            position: relative;
            margin-top: 7px !important;
            width: 100%;
            height: 20px;
            background-color: var(--foreground2);
            cursor: pointer;
            height: 44px;
            min-height: calc(1.5em + 1rem + 2px);
            font-size: 0.825rem;
            border: none;
            border-radius: 0.5rem;
            color: var(--text);
            font-weight: lighter;
            font-size: 15px;
            
        }

        .google_login {
            margin-top: 1rem !important;
            border-radius: 12px;
            width: 50%;
            height: auto;
            left: 50%;
            transform: translateX(50%);

        }
    </style>
</head>
<body>
    <div class="auth_container">
        <div class="centering">
            <picture class="auth_logo">
            <source srcset="../content/media/logo_White.png" media="(prefers-color-scheme: dark)">
                <img src="../content/media/logo_Black.png">
            </picture>
            <form novalidate id="login_form">
                <div class="form_input">
                    <label>Email<span aria-hidden="true"> *</span></label>
                    <input required autocomplete="email" type="text" id="email_login" class="form" autocorrect="off" spellcheck="off" minlength="5" maxlength="30">
                    <label id="1" class="input_error">Please enter your email.</label>
                </div>
                <div class="form_input2">
                    <label>Password<span aria-hidden="true"> *</span></label>
                    <input required autocomplete="current-password" type="password" id="password_login" class="form" autocorrect="off" spellcheck="off" minlength="8" maxlength="50">
                    <button type="button" class="toggle_password">
                        <svg style="fill: var(--text);" width="20px" height="20px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21.92,11.6C19.9,6.91,16.1,4,12,4S4.1,6.91,2.08,11.6a1,1,0,0,0,0,.8C4.1,17.09,7.9,20,12,20s7.9-2.91,9.92-7.6A1,1,0,0,0,21.92,11.6ZM12,18c-3.17,0-6.17-2.29-7.9-6C5.83,8.29,8.83,6,12,6s6.17,2.29,7.9,6C18.17,15.71,15.17,18,12,18ZM12,8a4,4,0,1,0,4,4A4,4,0,0,0,12,8Zm0,6a2,2,0,1,1,2-2A2,2,0,0,1,12,14Z"/></svg>
                    </button>
                    <label id="2" class="input_error">Please enter your password.</label>
                    <label class="link forgot">Forgot your username or password?</label>
                
                </div>
                <button type="submit" class="login_submit">Sign In</button>
            </form>
            <form novalidate id="signup_form" hidden>
                <div class="form_input">
                    <label>Email<span aria-hidden="true"> *</span></label>
                    <input required autocomplete="email" type="text" id="email_signup" class="form" autocorrect="off" spellcheck="off" minlength="5" maxlength="30">
                    <label id="3" class="input_error">Please enter your email.</label>
                </div>
                <div class="form_input2">
                    <label>Username<span aria-hidden="true"> *</span></label>
                    <input required type="text" id="username_signup" class="form" autocorrect="off" spellcheck="off" minlength="5" maxlength="20">
                    <label id="4" class="input_error">Please enter your username.</label>
                </div>
                <div class="form_input2">
                    <label>Password<span aria-hidden="true"> *</span></label>
                    <input required autocomplete="new-password" type="password" id="password_signup" class="form" autocorrect="off" spellcheck="off" minlength="8" maxlength="50">
                    <button type="button" class="toggle_password">
                        <svg style="fill: var(--text);" width="20px" height="20px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21.92,11.6C19.9,6.91,16.1,4,12,4S4.1,6.91,2.08,11.6a1,1,0,0,0,0,.8C4.1,17.09,7.9,20,12,20s7.9-2.91,9.92-7.6A1,1,0,0,0,21.92,11.6ZM12,18c-3.17,0-6.17-2.29-7.9-6C5.83,8.29,8.83,6,12,6s6.17,2.29,7.9,6C18.17,15.71,15.17,18,12,18ZM12,8a4,4,0,1,0,4,4A4,4,0,0,0,12,8Zm0,6a2,2,0,1,1,2-2A2,2,0,0,1,12,14Z"/></svg>
                    </button>
                    <label id="5" class="input_error">Please enter your password.</label>
                </div>
                <button type="submit" class="login_submit">Sign Up</button>
            </form>
            <a style="display: flex; justify-content: center; margin-top: 2.5%;"><span style="color: var(--text); font-size: 10px; font-weight: lighter;" id="change_method" class="change_method">Don't have an account?</span><span id="change_method_link" style="margin-left: 1%;" class="link">Sign up</span></a>
            <a style="color: var(--text); display: flex; justify-content: center; font-size: 15px; font-weight: 100; margin-top: 3.5%;">-- or continue with --</a>

            <div id="g_id_onload"
                data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                data-login_uri="https://your.domain/your_login_endpoint"
                data-auto_prompt="false">
            </div>

            <div class="google_login">
                <div class="g_id_signin"></div>
            </div>
        </div>
    </div>
</body>
    <script>
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        document.querySelectorAll(".toggle_password").forEach(function (button) {
            button.addEventListener("click", function () {
                const input = button.parentElement.querySelector("input");

                input.type = input.type === "text" ? "password" : "text"
            })
        })

        document.getElementById("login_form").addEventListener('submit', function (e) {
            e.preventDefault();

            const regex = /^[A-Za-z0-9!@#$%&.+\-_]+$/;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const emailDomains = [
                "gmail.com",
                "yahoo.com",
                "outlook.com",
                "hotmail.com",
                "icloud.com",
                "fcpsschools.net"
            ]

            const email = document.getElementById('email_login')
            const password = document.getElementById('password_login')
            if (email.value.trim() === "") {
                document.getElementById("1").style.visibility = "visible";
                document.getElementById("1").textContent = "Please enter your emil."
                document.getElementById("email_login").style.borderColor = "var(--error)";
            }
            else if (!emailPattern.test(email.value.trim()) || !emailDomains.includes(email.value.trim().split("@")[1]?.toLowerCase()) || !regex.test(email.value.trim())) {
                document.getElementById("1").style.visibility = "visible";
                document.getElementById("1").textContent = "Email is invalid format."
                document.getElementById("email_login").style.borderColor = "var(--error)";
            }
            else {
                document.getElementById("1").style.visibility = "hidden";
                document.getElementById("email_login").style.borderColor = "var(--foreground)";
            }

            if (password.value.trim() === "") {
                document.getElementById("2").style.visibility = "visible";
                document.getElementById("2").textContent = "Please enter your password."
                document.getElementById("password_login").style.borderColor = "var(--error)";
            }
            else if (password.value.trim().length < 8) {
                document.getElementById("2").style.visibility = "visible";
                document.getElementById("2").textContent = "Password is too short."
                document.getElementById("password_login").style.borderColor = "var(--error)";
            }
            else if (!regex.test(password.value.trim())) {
                document.getElementById("2").style.visibility = "visible";
                document.getElementById("2").textContent = "Password is invalid format."
                document.getElementById("password_login").style.borderColor = "var(--error)";
            }
            else {
                document.getElementById("2").style.visibility = "hidden";
                document.getElementById("password_login").style.borderColor = "var(--foreground)";
            }
        })

        document.getElementById("signup_form").addEventListener('submit', function (e) {
            e.preventDefault();

            const regex = /^[A-Za-z0-9!@#$%&.+\-_]+$/;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const emailDomains = [
                "gmail.com",
                "yahoo.com",
                "outlook.com",
                "hotmail.com",
                "icloud.com",
                "fcpsschools.net"
            ]

            const email = document.getElementById('email_signup')
            const username = document.getElementById('username_signup')
            const password = document.getElementById('password_signup')
            if (email.value.trim() === "") {
                document.getElementById("3").style.visibility = "visible";
                document.getElementById("3").textContent = "Please enter your emil."
                document.getElementById("email_signup").style.borderColor = "var(--error)";
            }
            else if (!emailPattern.test(email.value.trim()) || !emailDomains.includes(email.value.trim().split("@")[1]?.toLowerCase()) || !regex.test(email.value.trim())) {
                document.getElementById("3").style.visibility = "visible";
                document.getElementById("3").textContent = "Email is invalid format."
                document.getElementById("email_signup").style.borderColor = "var(--error)";
            }
            else {
                document.getElementById("3").style.visibility = "hidden";
                document.getElementById("email_signup").style.borderColor = "var(--foreground)";
            }

            if (password.value.trim() === "") {
                document.getElementById("5").style.visibility = "visible";
                document.getElementById("5").textContent = "Please enter your password."
                document.getElementById("password_signup").style.borderColor = "var(--error)";
            }
            else if (password.value.trim().length < 8) {
                document.getElementById("5").style.visibility = "visible";
                document.getElementById("5").textContent = "Password is too short."
                document.getElementById("password_signup").style.borderColor = "var(--error)";
            }
            else if (!regex.test(password.value.trim())) {
                document.getElementById("5").style.visibility = "visible";
                document.getElementById("5").textContent = "Password is invalid format."
                document.getElementById("password_signup").style.borderColor = "var(--error)";
            }
            else {
                document.getElementById("5").style.visibility = "hidden";
                document.getElementById("password_signup").style.borderColor = "var(--foreground)";
            }

            if (username.value.trim() === "") {
                document.getElementById("4").style.visibility = "visible";
                document.getElementById("4").textContent = "Please enter your username."
                document.getElementById("username_signup").style.borderColor = "var(--error)";
            }
            else if (username.value.trim().length < 5) {
                document.getElementById("4").style.visibility = "visible";
                document.getElementById("4").textContent = "Username is too short."
                document.getElementById("username_signup").style.borderColor = "var(--error)";
            }
            else if (!regex.test(username.value.trim())) {
                document.getElementById("4").style.visibility = "visible";
                document.getElementById("4").textContent = "Username is invalid format."
                document.getElementById("username_signup").style.borderColor = "var(--error)";
            }
            else {
                document.getElementById("4").style.visibility = "hidden";
                document.getElementById("username_signup").style.borderColor = "var(--foreground)";
            }
        })

        let current_method = 1;
        document.getElementById("change_method_link").addEventListener("click", function (e) {
            if (current_method == 1) {
                document.getElementById("signup_form").hidden = false
                document.getElementById("login_form").hidden = true
                document.getElementById("change_method").textContent = "Have an account?"
                document.querySelector("#change_method_link").textContent = "Sign In"
                document.title = "Signup | Pylingo"
                current_method = 0
            }
            else {
                document.getElementById("signup_form").hidden = true
                document.getElementById("login_form").hidden = false
                document.getElementById("change_method").textContent = "Don't have an account?"
                document.querySelector("#change_method_link").textContent = "Sign Up"
                document.title = "Login | Pylingo"
                current_method = 1
            }
        })
    </script>
</html>
