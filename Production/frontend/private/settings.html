<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.25">
    <title>Settings | Pylingo</title>
    <link rel="icon" type="image/x-icon" href="../content/media/favicon.ico">
    <link rel="stylesheet" href="../content/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --sidebar_width: max(13vw, 150px);
        }

        body {
            font-family: "Inter", system-ui, sans-serif;
            overflow: hidden;
        }

        #side_bar {
            position: fixed;
            top: 0px;
            left: 0px;
            height: 100%;
            width: var(--sidebar_width);
            background-color: var(--foreground);
            container-type: inline-size;
        }
        .side_logo img {
            width: 85%;
            height: auto;
            padding-left: 9%;
            padding-right: 9%;
            margin-top: 10%;
        }
        
        button {
            font: inherit;
        }

        .option_icon img {
            width: 15.4cqw;
            min-width: 20px;
        }

        .option_icon {
            flex: 0 0 25%;
            display: flex;
        }

        #side_bar_options {
            list-style-type: none;
            position: relative;
            padding: 0 10%;
        }

        #side_bar_options li {
            display: flex;
            margin-bottom: 10px;
        }

        #side_bar_options li button {
            border-radius: 12px;
            background: transparent;
            border: transparent;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 5% 3%;
        }

        #side_bar_options li button:hover {
            background-color: var(--foreground2);
        }

        .option_name {
            font-size: 7.7cqw;
            font-weight: 300;
            color: var(--text);
        }

        #main_body {
            margin-left: var(--sidebar_width);
            min-height: 100vh;
            box-sizing: border-box;
            padding: 1vh 2%;
        }

        #Welcome {
            display: flex;
            flex-direction: column;
        }

        .profile {
            position: absolute;
            top: 2cqw;
            right: 2cqw;
            aspect-ratio: 1 / 1;
            width: clamp(20px, 5cqw, 80px);
        }

        .profile picture img {
            border-radius: 12px;
        }

        #streak {
            right: 7.5cqw;
            top: 1.8cqw;
            position: absolute;
            width: clamp(60px, 15cqw, 240px);
            height: clamp(20px, 5cqw, 80px);
            justify-content: center;
            align-items: center;
            display: flex;
        }

        .streak_icon {
            aspect-ratio: 1 / 1;
            width: clamp(25px, 3.5cqw, 65px);
            height: 1em;
            width: auto;
            
        }

        .streak_count {
            font-weight: bold;
            font-size: 1.8em;
            line-height: 1;
        }
        
        #streak_text {
            display: flex;
            flex-direction: column;
            position: relative;
            left: 2%;
            line-height: 0.91;
            font-size: clamp(5px, 2cqw, 22px);
        }

        .streak_icon_top {
            height: clamp(20px, 3.5vw, 60px);
            width: auto;
        }

        #greeting {
            font-size: clamp(28px, 4.5cqw, 50px);
        }

        #settings_options {
            width: calc(57% - var(--sidebar_width));
            height: 75%;
            position: absolute;
            top: 15%;
            left: calc(var(--sidebar_width) + 2%);
            padding: 0;
        }

        .option {
            width: 100%;
            height: 20%;
            position: relative;
            margin-bottom: 5%;
            container-type: size;
        }

        .option button {
            cursor: pointer;
            border-radius: 12px;
            background-color: var(--foreground);
            border: none;
            display: flex;
        }

        .option button:hover {
            background-color: var(--foreground2);
        }

        .option_image {
            height: 90%;
            aspect-ratio: 1 / 1;
            left: 3%;
            top: 5%;
            position: relative;
            border: none;
            background-color: var(--foreground);
            border-radius: 12px;
        }

        .setting_title {
            color: var(--text);
            font-size: clamp(14px, 2vw, 30px);
            position: relative;
            left: 3%;
            top: 4%;
            white-space: nowrap;
            left: 5%;
            overflow: hidden;
            text-align: left;
            text-overflow: ellipsis;
        }

        .setting_description {
            color: var(--text);
            font-size: clamp(9px, 1vw, 15px);
            position: absolute;
            top: 40%;
            left: calc(5% + 90cqh + 10px);
            white-space: nowrap;
            overflow: hidden;
            text-align: left;
            text-overflow: ellipsis;
        }

        .next_arrow {
            color: var(--text);
            font-size: clamp(20px, 3vw, 50px);
            position: absolute;
            top: 25%;
            right: 5%;
        }

        #setting_stuff {
            position: absolute;
            width: 35%;
            height: 72%;
            background-color: var(--foreground);
            right: 3%;
            top: 17%;
            border-radius: 12px;
        }

        #setting_title_main {
            position: relative;
            top: 3%;
            left: 3%;
            font-size: clamp(20px, 2.5vw, 35px);
        }
    </style>
</head>
<body style="margin: 0;">
    <div id="side_bar">
        <picture class="side_logo">
            <source srcset="../content/media/logo_White.png" media="(prefers-color-scheme: dark)">
            <img src="../content/media/logo_Black.png">
        </picture>
        <ul id="side_bar_options">
            <li><button onclick="window.location.href='/dashboard';"><picture class="option_icon">
            <source srcset="../content/media/home_White.png" media="(prefers-color-scheme: dark)">
            <img src="../content/media/home_Black.png">
        </picture><span class="option_name">Home</span></button>
            </li>
            <li>
                <button onclick="window.location.href='/leaderboard';">
                    <picture class="option_icon">
                        <source srcset="../content/media/leaderboard_White.png" media="(prefers-color-scheme: dark)">
                        <img src="../content/media/leaderboard_Black.png">
                    </picture><span class="option_name">Leaderboard</span>
                </button>
                </li>
            <li><button onclick="window.location.href='/settings';"><picture class="option_icon">
                <source srcset="../content/media/settings_White.png" media="(prefers-color-scheme: dark)">
                <img src="../content/media/settings_Black.png">
            </picture><span  class="option_name">Settings</span></button></li>
        </ul>
    </div>

    <div id="main_body">
        <div id="Welcome">
            <span id="greeting">Settings</span>
        </div>
        <div id="streak">
            <img class="streak_icon_top" src="../content/media/fire.png">
            <div id="streak_text">
                <span class="streak_count">{{ streak }}</span>
                <span>day streak</span>
            </div>
        </div>
        <div class="profile">
            {% set picture = request.cookies.get("profile_picture") %}
            {% if picture %}
                <picture class="option_icon">
                    <img src="{{ picture }}">
                </picture>
            {% else %}
                <picture class="option_icon">
                    <source srcset="../content/media/empty-profile_White.png" media="(prefers-color-scheme: dark)">
                    <img src="../content/media/empty-profile_Black.png">
                </picture>
            {% endif %}
        </div>
        <ol id="settings_options" style="list-style: none;">
            <li class="option">
                <button style="width: 100%; height: 100%;">
                    <img class="option_image" src="../content/media/account.png">
                    <span class="setting_title">Account</span> 
                    <span class="setting_description">Update your Email, Password, and More!</span>
                    <span class="next_arrow">></span>
                </button>
            </li>
            <li class="option">
                <button style="width: 100%; height: 100%;">
                    <img class="option_image" src="../content/media/appearance.png">
                    <span class="setting_title">Appearence</span> 
                    <span class="setting_description">Change your app Appearence!</span>
                    <span class="next_arrow">></span>
                </button>
            </li>
            <li class="option">
                <button style="width: 100%; height: 100%;">
                    <img class="option_image" src="../content/media/privacy.png">
                    <span class="setting_title">Privacy</span> 
                    <span class="setting_description">Control your Data!</span>
                    <span class="next_arrow">></span>
                </button>
            </li>
            <li class="option">
                <button style="width: 100%; height: 100%;">
                    <img class="option_image" src="../content/media/help.png">
                    <span class="setting_title">Help & Support</span> 
                    <span class="setting_description">Get Help or Contact Team!</span>
                    <span class="next_arrow">></span>
                </button>
            </li>
        </ol>
        <div id="setting_stuff">
            <span id="setting_title_main">Account</span>
        </div>
    </div>
</body>
    <script>
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    </script>
</html>
