<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.25">
    <title>Dashboard | Pylingo</title>
    <link rel="icon" type="image/x-icon" href="../content/media/favicon.ico">
    <link rel="stylesheet" href="../content/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --sidebar_width: max(13vw, 150px);
        }

        body {
            font-family: "Inter", system-ui, sans-serif;
        }

        #side_bar {
            position: fixed;
            top: 0px;
            left: 0px;
            height: 100%;
            width: var(--sidebar_width);
            background-color: var(--foreground);
            min-width: 150px;
            container-type: inline-size;
        }
        .side_logo img {
            position: relative;
            width: 85%;
            height: auto;
            padding-left: 9%;
            padding-right: 9%;
            margin-top: 10% !important;
        }
        
        button {
            font: inherit;
        }

        .option_icon img {
            width: 15.4cqw !important;
            min-width: 20px;
            height: auto;
            position: relative;
        }

        .option_icon {
            flex: 0 0 25%;
            min-width: 20px;
            display: flex;
        }

        #side_bar_options {
            color: var(--text);
            list-style-type: none;
            padding-bottom: 3%;
            position: relative;
            padding: 0 10%;
        }

        #side_bar_options li {
            display: flex;
            position: relative;
            align-items: center;
            margin-bottom: 10px;
            justify-content: flex-start;
        }

        #side_bar_options li button {
            border-radius: 12px;
            background: transparent;
            border: transparent;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 5% 3%;
        }

        #side_bar_options li button:hover {
            background-color: var(--foreground2);
        }

        .option_name {
            font-size: 7.7cqw;
            font-weight: lighter;
            position: relative;
            color: var(--text);
        }

        #main_body {
            margin-left: var(--sidebar_width);
            min-height: 100vh;
            box-sizing: border-box;
            display: flow-root;
            padding: 1vh 2%;
        }

        #Welcome {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #greeting {
            font-size: clamp(28px, 4.5cqw, 50px);
        }

        #username {
            display: block;
            font-size: 35px;
            margin-left: 1.5%;
            font-size: clamp(20px, 3.2cqw, 35px);
            font-weight: 600;
        }

        .profile {
            position: absolute;
            top: 2cqw;
            right: 2cqw;
            aspect-ratio: 1 / 1;
            width: clamp(20px, 5cqw, 80px);
        }

        .profile picture img {
            border-radius: 12px;
        }

        #streak {
            right: 7cqw;
            top: 1.8cqw;
            position: absolute;
            width: clamp(60px, 15cqw, 240px);
            height: clamp(20px, 5cqw, 80px);
            justify-content: center;
            align-items: center;
            display: flex;
        }

        .streak_icon {
            aspect-ratio: 1 / 1;
            width: clamp(25px, 3.5cqw, 65px);;
            
        }

        .streak_count {
            font-weight: bold;
            font-size: 1.8em;
            line-height: 1;
        }
        
        #streak_text {
            display: flex;
            flex-direction: column;
            position: relative;
            left: 2%;
            line-height: 0.91;
            font-size: clamp(5px, 2cqw, 22px);
        }

        #continue {
            display: flex;
            margin-top: 3.5%;
            width: 60%;
            height: 30vh;
            border-radius: 12px;
        }

        #back {
            height: 100%;
            width: 45%;
            border-radius: 12px;
        }
        
        #back img {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            object-fit: cover;
        }

        #front {
            flex: 1;
            margin-left: -15%;
            display: flex;
            flex-direction: column;
            padding: 28px 32px;
            box-sizing: border-box;
            height: 100%;
            color: var(--text);
            border-radius: 12px;
            background-color: var(--foreground);
        }

        #upper {
            display: flex;
            gap: 4px;
            flex-direction: column;
        }

        #title {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 13px;
            font-weight: 600;
        }

        #unit {
            font-size: 20px;
        }

        #unit_name {
            color: var(--text);
            font-size: 48px;
            font-weight: 700;
            white-space: nowrap;
            margin-bottom: 20px;
            margin-top: auto;
        }

        #front button {
            align-self: flex-start;
            font-family: inherit;
            font-size: 16px;
            background-color: #6f9cc0;
            border-radius: 12px;
            font-family: inherit;
            padding: 12px 28px;
            color: var(--text);
            font-weight: 600;
            border: none;
        }

        #front button:hover {
            background-color: #88bbe4;
            cursor: pointer;
        }

        #course_title {
            display: block;
            position: relative;
            font-weight: 600;
            font-size: 30px;
            margin-top: 2.5%;
        }

    </style>
</head>
<body style="margin: 0;">
    <div id="side_bar">
        <picture class="side_logo">
            <source srcset="../content/media/logo_White.png" media="(prefers-color-scheme: dark)">
            <img src="../content/media/logo_Black.png">
        </picture>
        <ul id="side_bar_options">
            <li><button><picture class="option_icon">
            <source srcset="../content/media/home_White.png" media="(prefers-color-scheme: dark)">
            <img src="../content/media/home_Black.png">
        </picture><span class="option_name">Home</span></button>
            </li>
            <li>
                <button>
                    <picture class="option_icon">
                        <source srcset="../content/media/leaderboard_White.png" media="(prefers-color-scheme: dark)">
                        <img src="../content/media/leaderboard_Black.png">
                    </picture><span class="option_name">Leaderboard</span>
                </button>
                </li>
            <li><button><picture class="option_icon">
                <source srcset="../content/media/settings_White.png" media="(prefers-color-scheme: dark)">
                <img src="../content/media/settings_Black.png">
            </picture><span  class="option_name">Settings</span></button></li>
        </ul>
    </div>

    <div id="main_body">
        <div id="Welcome">
            <span id="greeting">Good morning,</span>
            <span id="username">Username!</span>
        </div>
        <div id="streak">
            <img class="streak_icon" src="../content/media/fire.png">
            <div id="streak_text">
                <span class="streak_count">12</span>
                <span>day streak</span>
            </div>
        </div>
        <div class="profile">
            <picture st class="option_icon">
                <source srcset="../content/media/empty-profile_White.png" media="(prefers-color-scheme: dark)">
                <img src="../content/media/empty-profile_Black.png">
            </picture>
        </div>
        <div id="continue">
            <div id="back"><img src="../content/media/temp.jpg"></div>
            <div id="front">
                <div id="upper">
                    <span id="title">New lesson</span>
                    <span id="unit">Unit 5 Lesson 2</span>
                </div>
                <span id="unit_name">Code Format</span>
                <button>Start Lesson ></button>
            </div>
        </div>
        <div id="courses">
            <span id="course_title">My Courses</span>
            <div id="course_list">

            </div>
        </div>
    </div>
</body>
    <script>
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    </script>
</html>
