<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB_CS_APP</title>
</head>
<body>
    <div class="option-buttons">
        <button class="email-button">%EMAIL%<span class="email-caret">^</span></button>
    </div>
</body>
<style>
    
    body {
        background-color: #bdbdbd;
        overflow: hidden;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;  
        font-family: 'Arial Black', sans-serif;
    }

    .option-buttons {
        position: absolute;
        top: 3%;
        right: 1.5%;
        z-index: 12;
        flex-direction: row;
        display: flex;
        gap: 10px;
        
    }

    .option-buttons button {
        background-color: transparent;
        border: 0px solid transparent;
        width: 80px;
        height: 30px;
        color: #1d1d1d;
        cursor: pointer;
        font-family: inherit;
    }

    .option-buttons button.active {
        background-color: #373737;
        width: 80px;
        height: 30px;
        border: 0px solid transparent;
        color: #929292;
        cursor: pointer;
        font-family: inherit;
    }

    .email-caret {
        position: relative;
        display: inline-block;
        top: 1.6px;
        left: 2px;
    }

    .email-button {
        display: inline-flex;
        align-items: center;
    }

    
</style>
</html>
