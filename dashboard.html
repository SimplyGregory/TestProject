<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

            <button class="email-button">%EMAIL%</button>
            <span class="email-caret">^</span>
        </div>
    </div>
</body>

        background-color: #bdbdbd;
        overflow: hidden;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;  
        font-family: 'Arial Black', sans-serif;
    }

    .option-buttons {
        position: absolute;
        top: 3%;

        z-index: 12;
        flex-direction: row;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        
    }

    .option-buttons button {

        border: 0px solid transparent;

        height: 30px;
        color: #1d1d1d;
        cursor: pointer;
        font-family: inherit;
    }

    .email-button {
        display: inline-flex;

        direction: rtl;
