<script>
    document.querySelector('.username-button').addEventListener('click', function() {
        const caret = document.querySelector('.username-caret');
        const caretContainer = document.querySelector('.caret-container');

        caret.style.transform = caret.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
        caretContainer.classList.toggle('hidden');
    });

    document.querySelectorAll('.option-buttons button:not(:has(span))').forEach(button => {
        button.addEventListener('click', function(event) {
            const buttons = document.querySelectorAll('.option-buttons button');
            buttons.forEach(button => button.classList.remove('active'));
            if (event.target.tagName === 'BUTTON') {
                event.target.classList.add('active');
            }
        });
    });
</script>
