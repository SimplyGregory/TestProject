<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB_CS_APP</title>
</head>
<body>
    <div class="option-buttons">
        <button class="username-button">
            <span class="username">username</span>
            <span class="username-caret">^</span>
        </button>
    </div>
</body>
<style>
    
    body {
        background-color: #bdbdbd;
        overflow: hidden;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;  
        font-family: 'Arial Black', sans-serif;
    }

    .option-buttons {
        position: absolute;
        top: 3%;
        right: 3%;
        z-index: 12;
        flex-direction: row;
        display: inline-flex;
        gap: 10px;
        justify-content: flex-end;
        text-align: right;
        direction: rtl;
        
    }

    .option-buttons button {
        background-color: transparent;
        border: 0px solid transparent;
        width: 100%;
        height: 20px;
        color: #1d1d1d;
        cursor: pointer;
        font-family: inherit;
    }

    .username-button {
        align-items: center;
        display: inline-flex;
        font-size: 14px;
        width: 0%;

    }
    .username-caret {
        position: relative;
        transform-origin: center 40%;
        font-size: 18px;
        top: 5px;
        left: 24px;
    }
</style>
<script>
    document.querySelector('.username-button').addEventListener('click', function() {
        const caret = document.querySelector('.username-caret');

        caret.style.transform = caret.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
    });
</script>
</html>
