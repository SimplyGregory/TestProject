<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB_CS_APP</title>
</head>
<body>
    <div class="option-buttons">
        <button class="username-button">
            <span class="username">{{ username }}</span>
            <span class="username-caret">^</span>
        </button>
        <button class="active" id="learnButton">LEARN</button>
        <button id="leaderboardButton">LEADERBOARD</button>
    </div>
    <div class="caret-container hidden">
        <button>Settings</button>
        <form method="POST" action="/send-logout"><button>Log Out</button></form>
    </div>

    <div id="body">
        <div id="learn">
            <div id="statistics">
                <span>streak: {{ streak }}</span>
            </div>
        </div>
        <div id="leaderboard" class="hidden">
            <div class="container">
                <a>Leaderboard</a>
                <ul class="leaderboard-list">
                    {% for rank, name in leaderboard %}
                        <li>{{ rank }}. {{ name }}</li>
                    {% endfor %}
                    <div>Your Rank: {{ leaderboard_placement}}. {{ username }}</div>
                </ul>
            </div>
        </div>
    </div>
</body>
<style>
    
    body {
        background-color: #bdbdbd;
        overflow: hidden;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;  
        font-family: 'Arial Black', sans-serif;
    }

    .option-buttons {
        position: absolute;
        top: 3%;
        right: 3%;
        z-index: 12;
        flex-direction: row;
        display: inline-flex;
        justify-content: flex-end;
        text-align: right;
        direction: rtl;
        
    }

    .option-buttons button.active {
        background-color: #373737;
        height: 30px;
        color: #929292;
        position: relative;
        top: -4px;
    }

    .option-buttons button {
        background-color: transparent;
        border: 0px solid transparent;
        height: 20px;
        color: #1d1d1d;
        cursor: pointer;
        font-family: inherit;
    }

    .option-buttons button:hover span:first-child {
        text-decoration: underline;
    }

    .option-buttons button:not(:has(span)):hover {
        text-decoration: underline;
    }

    .username-button {
        align-items: center;
        display: inline-flex;
        font-size: 14px;

    }
    .username-caret {
        position: relative;
        transform-origin: center 40%;
        font-size: 18px;
        top: 4px;
        left: 110%;
    }

    .caret-container {
        position: absolute;
        top: 7.5%;
        right: 1.8%;
        width: 100px;
        height: 60px;
        background-color: #373737;
    }
    .caret-container button {
        width: 90%;
        margin-top: 4px;
        margin-left: 5%;
        height: 40%;
        background-color: #bdbdbd;
        border: 0px solid transparent;
        color: #1d1d1d;
        cursor: pointer;
        font-family: inherit;
    }

    .caret-container button:hover {
        background-color: #a0a0a0;
    }

    .caret-container.hidden {
        display: none;
    }
    #statistics {
        position: absolute;
        right: 150px;
        top: 10%;
    }
    .hidden {
        visibility: hidden;
    }
</style>
<script>
    document.querySelector('.username-button').addEventListener('click', function() {
        const caret = document.querySelector('.username-caret');
        const caretContainer = document.querySelector('.caret-container');

        caret.style.transform = caret.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
        caretContainer.classList.toggle('hidden');
    });

    document.querySelectorAll('.option-buttons button:not(:has(span))').forEach(button => {
        button.addEventListener('click', function(event) {
            const buttons = document.querySelectorAll('.option-buttons button');
            buttons.forEach(button => button.classList.remove('active'));
            if (event.target.tagName === 'BUTTON') {
                event.target.classList.add('active');
                if (button.id == "leaderboardButton") {
                    document.getElementById("learn").hidden = false
                    document.getElementById("leaderboard").hidden = true
                }
                else {
                    document.getElementById("learn").hidden = true
                    document.getElementById("leaderboard").hidden = false
                }
            }
        });
    });
</script>
</html>
